name: Nightly Test Suite

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily

jobs:
  nightly-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests - ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          check_name: E2E Test Results - ${{ matrix.browser }}

  performance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:e2e -- --grep "performance|load.*time" || true

      - name: Capture performance metrics
        run: |
          mkdir -p metrics
          echo "Performance test completed at $(date)" > metrics/baseline.txt

      - name: Upload performance metrics
        uses: actions/upload-artifact@v4
        with:
          name: performance-metrics
          path: metrics/
          retention-days: 90

  full-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: |
          npm run test
          npm run test:integration
          npm run test:e2e

      - name: Generate comprehensive coverage
        run: npm run test:coverage

      - name: Upload coverage for trend analysis
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: coverage/
          retention-days: 90

      - name: Comment on repo if coverage drops
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8')).total;
            const threshold = 60;

            if (coverage.lines.pct < threshold) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,  // Post to repo discussions or pinned issue
                body: `⚠️ Nightly test: Coverage dropped to ${coverage.lines.pct.toFixed(1)}% (threshold: ${threshold}%)`
              });
            }
