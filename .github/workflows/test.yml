name: Tests & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: ctrl_alt_news_test
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # AC1: TypeScript checking
      - name: TypeScript Check
        run: npm run check
      
      # AC2: Linting
      - name: ESLint
        run: npm run lint
      
      # AC3: Unit tests
      - name: Unit Tests
        run: npm run test
      
      # AC4: Integration tests
      - name: Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ctrl_alt_news_test
          NODE_ENV: test
        run: npm run test:integration
      
      # AC6: Build validation
      - name: Build
        run: npm run build
      
      # AC7: Upload build artifact
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      # AC5: E2E tests
      - name: Run E2E Tests
        run: npm run test:e2e
      
      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Run Coverage
        run: npm run test:coverage
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  status:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always()
    
    steps:
      - name: Check Status
        if: failure()
        run: exit 1
      
      - name: Success
        if: success()
        run: echo "All checks passed!"
