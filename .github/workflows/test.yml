name: Tests & Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for coverage analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: TypeScript type check
        run: npm run check

      - name: Run unit & integration tests
        run: npm run test
        env:
          NODE_ENV: test

      # E2E tests disabled temporarily - causing CI/CD hang
      # TODO: Investigate and fix E2E test runner in separate story
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      #
      # - name: Run E2E tests
      #   run: npm run test:e2e
      #   continue-on-error: true

      - name: Generate coverage report
        if: always()
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20'  # Only once
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
          verbose: true


  coverage-check:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage check
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          node scripts/check-coverage.js --lines 28 --functions 60 --branches 70 --statements 28


  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, coverage-check]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.coverage-check.result }}" != "success" ]; then
            echo "❌ Quality gate failed"
            exit 1
          fi
          echo "✅ All quality gates passed"
