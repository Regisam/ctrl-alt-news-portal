name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Deploy to ${{ github.event.inputs.environment }}
        run: |
          npm run deploy:${{ github.event.inputs.environment }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ secrets.DB_URL }}

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 5
          curl -f ${{ secrets.DEPLOY_URL }}/health || exit 1

      - name: Notify on success
        if: success()
        run: |
          if [ ! -z "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
              -H 'Content-Type: application/json' \
              -d '{"text":"✅ Deployment to ${{ github.event.inputs.environment }} successful"}'
          fi

      - name: Notify on failure
        if: failure()
        run: |
          if [ ! -z "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
              -H 'Content-Type: application/json' \
              -d '{"text":"❌ Deployment to ${{ github.event.inputs.environment }} failed"}'
          fi
