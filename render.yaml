services:
  - type: web
    name: ctrl-alt-news-portal
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm run build
    startCommand: NODE_ENV=production node server-ultra-simple.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ctrl-alt-news-db
          property: connectionString

databases:
  - name: ctrl-alt-news-db
    databaseName: ctrlaltnewsdb
    user: postgres
    region: oregon
    plan: free
