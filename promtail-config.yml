server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect application logs
  - job_name: ctrl-alt-news-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: ctrl-alt-news
          __path__: /app/logs/*log
          service: ctrl-alt-news-server
          environment: development

  # Collect system logs
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log
          service: system
          environment: development

  # Parse JSON logs
  - job_name: json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: json
          __path__: /app/logs/combined.log
          service: ctrl-alt-news-server
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            request_id: request_id
            duration_ms: duration_ms
      - timestamp:
          source: timestamp
          format: '2006-01-02T15:04:05.000Z07:00'
      - labels:
          level:
          request_id:
          message:
