version: '3.9'

services:
  loki:
    image: grafana/loki:latest
    container_name: ctrl-alt-loki
    ports:
      - '3100:3100'
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    environment:
      - LOKI_CONFIG_FILENAME=/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3100/loki/api/v1/status/buildinfo']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - observability

  promtail:
    image: grafana/promtail:latest
    container_name: ctrl-alt-promtail
    ports:
      - '9080:9080'
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - ./logs:/app/logs:ro
    environment:
      - HOSTNAME=ctrl-alt-news
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: ctrl-alt-grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - observability

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  observability:
    driver: bridge
