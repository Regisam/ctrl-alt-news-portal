version: '3.9'

services:
  # Jaeger all-in-one for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      # Enable OTLP gRPC and HTTP receivers
      - COLLECTOR_OTLP_ENABLED=true

      # Storage backend (badger provides persistent storage)
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key

      # Trace retention: 7 days (604800 seconds)
      - BADGER_SPAN_STORE_TTL=604800s

      # Performance tuning
      - BADGER_VALUE_LOG_FILE_SIZE=268435456  # 256MB per file
      - COLLECTOR_GRPC_HOST_PORT=0.0.0.0:4317
      - COLLECTOR_HTTP_HOST_PORT=0.0.0.0:4318

      # Sampling configuration (can be overridden at runtime)
      - SAMPLING_STRATEGIES_FILE=/etc/jaeger/sampling_strategies.json

    ports:
      # Jaeger UI
      - '16686:16686'

      # OTLP receivers (gRPC + HTTP)
      - '4317:4317'    # OTLP gRPC receiver (what we use)
      - '4318:4318'    # OTLP HTTP receiver

      # Legacy Jaeger agent (UDP)
      - '6831:6831'    # Jaeger agent compact Thrift
      - '6832:6832'    # Jaeger agent binary Thrift

      # Zipkin compatibility
      - '9411:9411'    # Zipkin HTTP receiver

    volumes:
      # Persistent trace storage
      - jaeger-data:/badger

      # Sampling strategies configuration
      - ./jaeger-sampling-strategies.json:/etc/jaeger/sampling_strategies.json:ro

    networks:
      - observability

    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:16686/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  jaeger-data:
    driver: local

networks:
  observability:
    driver: bridge
    name: observability
